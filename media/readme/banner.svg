<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Eternal: a self-hosted control panel for proxy and VPN servers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0918"/>
      <stop offset="0.55" stop-color="#14103a"/>
      <stop offset="1" stop-color="#1f1768"/>
    </linearGradient>
    <radialGradient id="glow" cx="1010" cy="200" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c6cf5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c6cf5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8d85f2"/><stop offset=".5" stop-color="#5b4fe0"/><stop offset="1" stop-color="#3b30b0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9c3ff"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#8d85f2" fill-opacity=".16"/></pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#dots)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- network graphic -->
  <g transform="translate(838 52) scale(.86)" fill="none" stroke="#8d85f2" stroke-linecap="round">
    <g stroke-opacity=".55" stroke-width="2">
      <path d="M260 170 L110 70"/><path d="M260 170 L110 270"/><path d="M260 170 L430 60"/><path d="M260 170 L440 290"/>
      <path d="M110 70 L60 190"/><path d="M110 270 L60 190"/><path d="M430 60 L480 175"/><path d="M440 290 L480 175"/>
    </g>
    <g stroke-opacity=".9" stroke-width="2.5" stroke-dasharray="3 9"><path d="M260 170 L110 70"/><path d="M260 170 L440 290"/></g>
  </g>
  <g transform="translate(838 52) scale(.86)">
    <g fill="#1b1650" stroke="#8d85f2" stroke-width="2.5">
      <circle cx="110" cy="70" r="22"/><circle cx="110" cy="270" r="22"/><circle cx="430" cy="60" r="22"/><circle cx="440" cy="290" r="22"/>
      <circle cx="60" cy="190" r="14"/><circle cx="480" cy="175" r="14"/>
    </g>
    <g fill="#c9c3ff"><circle cx="110" cy="70" r="6"/><circle cx="110" cy="270" r="6"/><circle cx="430" cy="60" r="6"/><circle cx="440" cy="290" r="6"/></g>
    <circle cx="260" cy="170" r="70" fill="#7c6cf5" fill-opacity=".35" filter="url(#soft)"/>
    <g transform="translate(200 110) scale(.1172)"><rect width="1024" height="1024" rx="230" fill="url(#mark)"/>
      <g fill="none" stroke="#fff" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"><path d="M553 551H263A145 145 0 0 1 553 551M263 551A145 145 0 0 0 408 696H560A97 97 0 0 0 657 599V328M594 459H763"/></g></g>
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#cfcaff" text-anchor="middle">
      <text x="110" y="116">node</text><text x="110" y="316">node</text><text x="430" y="106">tunnel</text><text x="440" y="336">node</text>
    </g>
  </g>

  <!-- text -->
  <g transform="translate(72 84)">
    <g transform="scale(.1)"><rect width="1024" height="1024" rx="230" fill="url(#mark)"/>
      <g fill="none" stroke="#fff" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"><path d="M553 551H263A145 145 0 0 1 553 551M263 551A145 145 0 0 0 408 696H560A97 97 0 0 0 657 599V328M594 459H763"/></g></g>
    <text x="128" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">Eternal</text>
  </g>
  <text x="72" y="238" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#e8e6ff">The self-hosted panel for proxy and VPN servers.</text>
  <text x="72" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#a9a4e6">One binary. Every protocol. Nodes, tunnels, a shop and a Telegram bot built in.</text>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8e6ff">
    <g transform="translate(72 316)">
      <rect width="104" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#8d85f2" stroke-opacity=".5"/><text x="52" y="22" text-anchor="middle">Xray-core</text>
      <g transform="translate(116 0)"><rect width="104" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#8d85f2" stroke-opacity=".5"/><text x="52" y="22" text-anchor="middle">OpenVPN</text></g>
      <g transform="translate(232 0)"><rect width="84" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#8d85f2" stroke-opacity=".5"/><text x="42" y="22" text-anchor="middle">IKEv2</text></g>
      <g transform="translate(328 0)"><rect width="116" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#8d85f2" stroke-opacity=".5"/><text x="58" y="22" text-anchor="middle">WireGuard</text></g>
      <g transform="translate(456 0)"><rect width="92" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#8d85f2" stroke-opacity=".5"/><text x="46" y="22" text-anchor="middle">Tunnels</text></g>
      <g transform="translate(560 0)"><rect width="72" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#8d85f2" stroke-opacity=".5"/><text x="36" y="22" text-anchor="middle">Shop</text></g>
    </g>
  </g>
  <text x="72" y="388" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#7f7ab8">GPL-3.0 · a fork of 3x-ui</text>
</svg>
